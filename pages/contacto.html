<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="/estilos/contacto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Contacto</title>
</head>
<body>
    <header>
        <nav class="navbar">
            
            <img src="../images/2.png" alt="logotipo NP" width="170">
            
            <ul nav-links>
                    
                    <li><a href="../index.html">Inicio</a></li>

                    <li><a href="">Nosotros</a></li>

                    <li><a href="./productos.html">Productos</a></li>

                    <li><a href="">Servicios</a></li>

                    <li><a href="">Contacto</a></li>
                        
                </ul>
        </nav>

    </header>

    <main>

        <section class="formulario">
            <div class="contactForm">
                <div class="form">
                    <div class="texto">
                        <h2>¡Contactate con nosotros!</h2>
                    </div>

                    <form action="https://formspree.io/mi-cuenta" method="POST">

                        <div class="inputBox">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>
                        
                        <div class="inputBox">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="inputBox">
                            <label for="tel">Telefono:</label>
                            <input type="tel" name="tel" id="tel">
                        </div>
                            
                        <div class="inputBox">
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea>
                        </div>
        
            
                        <button type="submit">Enviar</button>

                    </form>
                </div>

            </div>
            
            
        </section>

    </main>


    
    <footer>

            <div class="follow">
                <h4>¡Seguinos en nuestras redes sociales!</h4>
                <ul>
                    <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                    <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                    <li><a href="#"><i class="fa-brands fa-tiktok"></i></a></li>
                </ul>
            </div>


        <div class="copyright">
            <p>Copyright © 2026 Diseñado y desarrolado por Nicolas Pagano</p>
            <p>Defensa de las y los consumidores.</p>
            <p>Para reclamos ingresa acá</p>
        </div>
        
    </footer>
</body>
</html>
